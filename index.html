<script>
const NAMA="Suwarni S.Pd.";
const T=["Sampul","Disklaimer","Daftar Isi","Bab V · Mempelajari","Arus dan Tegangan Efektif","Arus dan Tegangan Rata-Rata","Impedansi","Rangkaian Murni dan Kombinasi","Rangkaian Resonansi","Daya pada Rangkaian Bolak-Balik","Penerapan Rangkaian Listrik Bolak-Balik","Contoh Soal","Penyelesaian Contoh Soal"];
const N=T.length;
const v=(s,b)=>`<i class="v">${s}${b?`<sub>${b}</sub>`:""}</i>`;
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const sq=x=>`<span class="sq"><svg viewBox="0 0 10 20" preserveAspectRatio="none"><path d="M0 12L2 11L5 19L10 0"/></svg><span>${x}</span></span>`;
const sb=(m,s)=>`${m}<tspan dy="6" font-size="15">${s}</tspan><tspan dy="-6">&#8203;</tspan>`;
const wv=(cur,ln)=>{const W=520,H=190,A=62,m=H/2;const p=f=>{let d="";for(let x=0;x<=W;x+=5)d+=(x?"L":"M")+x+" "+(m-A*Math.sin(x/W*Math.PI*4+f)).toFixed(1);return d};

`<div class="two"><div class="col"><span class="tag a">BESARAN AC</span><h1 class="a">Arus dan Tegangan Efektif</h1><p class="a">Nilai efektif arus dan tegangan bolak-balik adalah nilai arus dan tegangan bolak-balik yang dianggap setara dengan arus dan tegangan searah yang menghasilkan sejumlah kalor yang sama ketika melalui suatu penghantar dalam waktu yang sama.</p><p class="a">Apabila tegangan dan kuat arus diukur dengan alat ukur arus bolak-balik, seperti voltmeter AC, atau multimeter, nilai yang ditunjukkan oleh alat tersebut merupakan nilai efektifnya. Berdasarkan perhitungan, didapatkan hubungan antara nilai efektif dan nilai maksimum sebagai berikut.</p></div><div class="col"><div class="gl wc a">${wv([[0,"#1b8cf5"]],[[1,sb("V","m")],[.707,sb("V","ef")]])}</div><div class="fr2"><div class="gl fx a"><div>${v("V","ef")} = ${fr(v("V","m"),sq("2"))}</div><small>${v("V","ef")} = tegangan efektif (V)<br>${v("V","m")} = tegangan maksimum (V)</small></div><div class="gl fx a"><div>${v("I","ef")} = ${fr(v("I","m"),sq("2"))}</div><small>${v("I","ef")} = arus efektif (A)<br>${v("I","m")} = arus maksimum (A)</small></div></div></div></div>`,
`<div class="two"><div class="col"><span class="tag a">BESARAN AC</span><h1 class="a">Arus dan Tegangan Rata-Rata</h1><p class="a">Harga rata-rata arus bolak-balik adalah harga yang dianggap setara dengan harga arus searah yang tetap memindahkan sejumlah muatan yang sama dalam waktu yang sama.</p></div><div class="col"><div class="gl wc a">${wv([[0,"#1b8cf5"]],[[1,sb("V","m")],[.637,sb("V","r")]])}</div><div class="fr2"><div class="gl fx a"><div style="font-size:27px">${v("I","r")} = ${fr(`2${v("I","m")}`,"π")} = 0,637${v("I","m")}</div><small>${v("I","r")} = arus rata-rata (A)</small></div><div class="gl fx a"><div style="font-size:27px">${v("V","r")} = ${fr(`2${v("V","m")}`,"π")} = 0,637${v("V","m")}</div><small>${v("V","r")} = tegangan rata-rata (V)</small></div></div></div></div>`,
`<div class="two"><div class="col"><span class="tag a">BESARAN AC</span><h1 class="a">Impedansi (${v("Z")})</h1><p class="a">Impedansi dapat didefinisikan sebagai besaran yang merupakan nisbah atau perbandingan antara tegangan dengan arus. Impedansi terkait dengan sifat menghambat arus. Lawan dari besaran ini adalah admitansi yaitu sifat menghantarkan arus. Admitansi merupakan perbandingan arus listrik efektif terhadap tegangan efektifnya (yang berbentuk sinusoidal).</p><p class="a">Secara matematis, nilai impedansi dirumuskan sebagai berikut.</p></div><div class="col"><div class="gl wc a">${wv([[0,"#1b8cf5"],[-.9,"#00b8e6"]],[])}<div class="lgs"><span style="--c:#1b8cf5">Tegangan (${v("V")})</span><span style="--c:#00b8e6">Arus (${v("I")})</span></div></div><div class="gl fx a" style="font-size:44px"><div>${v("Z")} = ${fr(v("V"),v("I"))}</div></div></div></div>`,

`<div class="two"><div class="col"><span class="tag a">RANGKAIAN AC</span><h1 class="a">Rangkaian Resonansi</h1><p class="a">Pada dasarnya rangkaian resonansi adalah rangkaian seri ${v("R")}–${v("L")}–${v("C")} yang mengikuti suatu keadaan tertentu. Rangkaian resonansi terjadi jika impedansi rangkaian bernilai real, artinya komponen imajiner bernilai nol. Keadaan ini menyatakan bahwa nilai ${v("Z")} = ${v("R")}. Besar reaktansi induktif dan kapasitif sama (${v("X","L")} = ${v("X","C")}). Tinjau impedansi total pada rangkaian seri ${v("R")}–${v("L")}–${v("C")}, impedansi total rangkaian resonansi sebesar:</p></div><div class="col" style="gap:18px"><div class="gl fx a"><em>IMPEDANSI TOTAL</em><div style="font-size:38px">|${v("Z")}| = ${sq(`${v("R")}<sup>2</sup>`)} = ${v("R")}</div></div><p class="a" style="padding-left:6px">Besarnya frekuensi resonansi rangkaian adalah:</p><div class="gl fx a"><em>FREKUENSI RESONANSI</em><div style="font-size:42px">${v("f","r")} = ${fr("1","2π")} ${sq(fr("1",v("LC")))}</div></div></div></div>`,

`<h1 class="ti2 a" style="font-size:34px">Penerapan Rangkaian Listrik Bolak-Balik</h1><div class="two2"><div class="gl cd a"><h3><i>a</i>Tuning</h3><p>Tuning telah banyak dibahas pada subpokok bahasan sebelumnya. Kapasitor atau kondensator variabel menjadi komponen penting dalam rangkaian ini. Antena menerima sinyal dari stasiun transmitter dengan frekuensi bersesuaian dengan frekuensi yang dikeluarkan stasiun tersebut. Supaya stasiun receiver mampu menerjemahkan informasi dalam sinyal yang ditangkap, kondensator variabel harus diputar sehingga terjadi resonansi.</p></div><div class="gl cd a"><h3><i>b</i>Filter</h3><p>Filter adalah rangkaian penyaring frekuensi. Filter mampu meloloskan frekuensi tertentu dan memblokir frekuensi lain. Filter ada dua macam yaitu filter aktif dan pasif. Hal yang membedakan keduanya adalah filter pasif mampu melakukan filter terhadap sinyal masukan sekaligus melakukan atenuasi atau penguatan terhadap sinyal output. Filter aktif memanfaatkan komponen aktif seperti transistor dan penguat operasional (Op-Amp). Sementara filter pasif hanya melakukan penyaringan tanpa memperkuat sinyal output. Filter pasif cenderung memperlemah sinyal masukan karena adanya energi yang terdisipasi saat proses filtering atau penyaringan berlangsung.</p></div></div>`,
`<div class="two"><div class="col"><span class="tag a">CONTOH SOAL</span><h1 class="a">Rangkaian Seri ${v("R")}–${v("L")}–${v("C")}</h1><p class="a">Rangkaian seri ${v("R")}–${v("L")}–${v("C")} tersusun atas ${v("R")} = 25 Ω, ${v("L")} = 10 H, dan ${v("C")} = 2,5 F. Rangkaian tersebut dihubungkan dengan sumber tegangan AC sehingga terjadi resonansi. Hitunglah:</p><ul class="lst a"><li><b>a.</b>frekuensi resonansi rangkaian;</li><li><b>b.</b>frekuensi sudut resonansi;</li><li><b>c.</b>impedansi total pada rangkaian.</li></ul></div><div class="col" style="gap:18px"><div class="gl fx a" style="align-items:flex-start;padding:22px 30px"><em>DIKETAHUI</em><div class="chp">${v("R")} = 25 Ω<br>${v("L")} = 10 H<br>${v("C")} = 2,5 F</div></div><div class="gl fx a" style="align-items:flex-start;padding:22px 30px"><em>DITANYAKAN</em><div class="chp">a. ${v("f","r")}<br>b. ${v("ω","r")}<br>c. ${v("Z")}</div></div></div></div>`,
`<div class="two" style="grid-template-columns:1.15fr 1fr;align-items:stretch"><div class="gl cd a" style="padding:18px 28px"><h3>a. Frekuensi resonansi rangkaian</h3><div class="eq"><div>${v("f","r")} = ${fr("1","2π")} ${sq(fr("1",v("LC")))}</div><div class="q">= ${fr("1","2π")} ${sq(fr("1","(10 H)(2,5 F)"))}</div><div class="q">= ${fr("1","2π")} ${sq(fr("1","25"))} Hz</div><div class="q">= ${fr("1","2π")} ${sq("0,04")} Hz</div><div class="q">= ${fr("1","2π")} (0,2) Hz</div><div class="q">= ${fr("0,1","π")} Hz</div></div><p class="jd">Jadi, frekuensi resonansi rangkaian adalah ${fr("0,1","π")} Hz.</p></div><div class="col" style="gap:16px"><div class="gl cd a" style="padding:18px 28px"><h3>b. Frekuensi sudut resonansi</h3><div class="eq"><div>${v("ω","r")} = 2π${v("f","r")} = 2π(${fr("0,1","π")}) = 0,2 rad/s</div></div><p class="jd">Jadi, frekuensi sudut resonansi adalah 0,2 rad/s.</p></div><div class="gl cd a" style="padding:18px 28px"><h3>c. Impedansi total pada rangkaian</h3><div class="eq"><div>|${v("Z")}| = ${v("R")} = 25 Ω</div></div><p class="jd">Jadi, impedansi total pada rangkaian adalah 25 Ω.</p></div><a class="gl vid a" href="http://bit.ly/2UPrBt6" target="_blank" rel="noopener">Video Tutorial · bit.ly/2UPrBt6</a></div></div>`

let dp=null,nt;
function syncInst(){$("inst").classList.toggle("on",cur===0&&!isApp())}
function note(t){const n=$("note");n.textContent=t;n.classList.add("on");clearTimeout(nt);nt=setTimeout(()=>n.classList.remove("on"),6500)}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
addEventListener("appinstalled",()=>{dp=null;note("Aplikasi Fisika BAB5 berhasil dipasang. Buka dari layar utama atau menu aplikasi.");syncInst()});
$("inst").onclick=async()=>{
if(dp){dp.prompt();const c=await dp.userChoice;dp=null;if(c.outcome==="accepted")note("Memasang Fisika BAB5…");return}
if(/iphone|ipad|ipod/i.test(navigator.userAgent))return note("Di iPhone/iPad: ketuk tombol Bagikan, lalu pilih Tambah ke Layar Utama.");
if(location.protocol==="file:")return note("Pemasangan butuh alamat https (misalnya GitHub Pages). Unggah folder ini dulu, lalu buka alamatnya.");
note("Klik ikon pasang di kolom alamat browser, atau menu browser lalu Instal Fisika BAB5 / Tambahkan ke layar utama.")};
addEventListener("pointerdown",()=>{if(isApp()&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})},{once:true});
matchMedia("(display-mode: fullscreen)").addEventListener&&matchMedia("(display-mode: fullscreen)").addEventListener("change",syncInst);
syncInst();
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>

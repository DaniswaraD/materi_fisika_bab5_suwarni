<script>
const NAMA="Suwarni S.Pd.";
const T=["Sampul","Disklaimer","Tujuan Pembelajaran","Radiasi Gelombang Elektromagnetik","Apa Itu Gelombang Elektromagnetik?","Terbentuknya Gelombang Elektromagnetik","Sifat Gelombang Elektromagnetik","Rumus Penting","Awalan Satuan dan Langkah Menghitung","Spektrum Gelombang Elektromagnetik","Manfaat Gelombang Elektromagnetik","Bahaya Radiasi","Coba Sendiri: Geser Frekuensi","Ringkasan Materi","Contoh Soal 1: Panjang Gelombang","Contoh Soal 2: Waktu Rambat","Contoh Soal 3: Frekuensi Cahaya","Contoh Soal 4: Energi Foton","Latihan Soal"];

const v=(s,b)=>`<i class="v">${s}${b?`<sub>${b}</sub>`:""}</i>`;
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;

ir:'<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',

["mikro","Gelombang Mikro","#0284c7","#38bdf8","1 mm – 30 cm","10<sup>9</sup> – 3×10<sup>11</sup> Hz","Radar, oven microwave, dan komunikasi satelit.","Pemanasan jaringan tubuh dan gangguan pada mata bila paparan kuat."],
["ir","Inframerah","#dc2626","#fb923c","700 nm – 1 mm","3×10<sup>11</sup> – 4,3×10<sup>14</sup> Hz","Remote kontrol, kamera malam, pemanas, dan terapi otot.","Panas berlebih dapat membakar kulit dan merusak mata."],
["tampak","Cahaya Tampak","#8b5cf6","#f59e0b","400 – 700 nm","4,3×10<sup>14</sup> – 7,5×10<sup>14</sup> Hz","Penglihatan, fotosintesis, fotografi, dan serat optik.","Cahaya sangat terang atau laser dapat merusak retina."],

["x","Sinar-X","#0f4c81","#1b8cf5","0,01 – 10 nm","3×10<sup>16</sup> – 3×10<sup>19</sup> Hz","Foto rontgen tulang, pemeriksaan bagasi, dan analisis struktur kristal.","Merusak sel dan jaringan; paparan berulang memicu kanker."],

const emw=()=>{const W=520,y0=168;let e="",b="",st="";for(let x=30;x<=500;x+=3){const s=Math.sin((x-30)/150*2*Math.PI);e+=(x==30?"M":"L")+x+" "+(y0-70*s).toFixed(1);b+=(x==30?"M":"L")+(x-52*s).toFixed(1)+" "+(y0+22*s).toFixed(1)}
for(let x=45;x<=495;x+=15){const s=Math.sin((x-30)/150*2*Math.PI);st+=`<path class="st" d="M${x} ${y0}V${(y0-70*s).toFixed(1)}"/><path class="st" d="M${x} ${y0}L${(x-52*s).toFixed(1)} ${(y0+22*s).toFixed(1)}"/>`}

const FM=[[`${v("c")} = λ${v("f")}`,"CEPAT RAMBAT",0,10,14],[`${v("c")} = ${fr("1",sq(`${v("μ","0")}${v("ε","0")}`))}`,"RUANG HAMPA",215,125,-18],[`${v("E")} = ${v("h")}${v("f")}`,"ENERGI FOTON",30,235,22],[`${v("c")} = ${fr(v("E"),v("B"))}`,"MEDAN E DAN B",245,335,-12]];
const lk=(g,t)=>`<div class="lk" data-g="${g}">${t}</div>`;
const sf=["Perubahan medan magnet dan medan listrik terjadi pada saat yang sama sehingga kedua medan memiliki harga maksimum dan minimum pada saat yang sama dan pada tempat yang sama.","Penjalaran medan magnetik tegak lurus dengan arah rambat gelombang sehingga merupakan gelombang transversal.","Mengalami peristiwa pemantulan, pembiasaan, interferensi, difraksi, dan polarisasi.","Tidak dipengaruhi oleh medan listrik dan magnet karena tidak memiliki muatan.","Dalam ruang hampa merambat dengan kelajuan 3 × 10<sup>8</sup> m/s. Kecepatannya akan berubah jika merambat pada medium yang memiliki kerapatan berbeda."];
const cards=i=>BD.map(b=>`<div class="gl bd a">${ic(b[0],b[2],b[3])}<h4>${b[1]}</h4><p>${b[i]}</p></div>`).join("");
const S0=[
`<div class="cov"><div class="gl cp a"><span class="tag">SMA/MA KELAS XII</span><div class="ft">${[..."FISIKA"].map((l,k)=>`<span style="--k:${k}">${l}</span>`).join("")}</div><h2 style="color:var(--ink);font-size:27px">Radiasi Gelombang Elektromagnetik</h2><p style="font-size:17px;color:var(--mut);font-weight:600">Peminatan Matematika dan Ilmu-Ilmu Alam</p><div class="row"><div class="gl by"><i>S</i><span>Oleh<b>${NAMA}</b></span></div><button class="cta" data-g="1">Mulai<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div><div class="fls">${FM.map((f,k)=>`<div class="fl a" style="left:${f[2]}px;top:${f[3]}px;--k:${f[4]}"><div class="gl" style="animation-delay:${-k*1.1}s">${f[0]}<small>${f[1]}</small></div></div>`).join("")}</div></div>`,
`<h1 class="ti2 a">Disklaimer</h1>${dis.map((x,i)=>`<div class="gl dli a"><span class="n">${i+1}</span>${x}</div>`).join("")}`,
`<h1 class="ti2 a">Tujuan Pembelajaran</h1>${["Peserta didik mampu menjelaskan sifat-sifat gelombang elektromagnetik dengan benar setelah melakukan kegiatan praktikum dan diskusi.","Peserta didik mampu menjelaskan manfaat dan bahaya radiasi gelombang elektromagnetik dengan benar setelah melakukan kegiatan praktikum dan diskusi."].map((x,i)=>`<div class="gl dli tj a">${ic(i?"shield":"bolt")}<span>${x}</span><b>${i+1}</b></div>`).join("")}`,
`<h1 class="ti2 a">Radiasi Gelombang Elektromagnetik</h1><h2 class="a" style="margin:-8px 0 22px 26px">Mempelajari :</h2><div class="three"><div class="gl cd a">${ic("bolt")}<h3>Sifat Gelombang Elektromagnetik</h3>${lk(4,"Sifat-sifat gelombang")}${lk(5,"Rumus penting")}</div><div class="gl cd a">${ic("tampak","#8b5cf6","#f59e0b")}<h3>Spektrum, Manfaat, dan Bahayanya</h3>${lk(6,"Spektrum gelombang")}${lk(7,"Manfaat")}${lk(8,"Bahaya radiasi")}</div><div class="gl cd a">${ic("calc","#0284c7","#38bdf8")}<h3>Latihan</h3>${lk(9,"Contoh soal")}</div></div>`,
`<h1 class="ti2 a">Sifat Gelombang Elektromagnetik</h1><div class="two" style="grid-template-columns:1.25fr 1fr;align-items:start"><div>${sf.map((x,i)=>`<div class="gl sf a"><span class="n">${"abcde"[i]}</span><span>${x}</span></div>`).join("")}</div><div class="col"><div class="gl wc a">${emw()}</div><div class="gl fx a"><em>KECEPATAN DI RUANG HAMPA</em><div>${v("c")} = 3 × 10<sup>8</sup> m/s</div></div></div></div>`,
`<h1 class="ti2 a">Rumus Penting</h1><div class="fr2" style="gap:18px"><div class="gl fx a"><em>CEPAT RAMBAT GELOMBANG</em><div style="font-size:42px">${v("c")} = λ${v("f")}</div><small>${v("c")} = kecepatan (m/s)<br>λ = panjang gelombang (m)<br>${v("f")} = frekuensi (Hz)</small></div><div class="gl fx a"><em>ENERGI FOTON</em><div style="font-size:42px">${v("E")} = ${v("h")}${v("f")} = ${fr(`${v("h")}${v("c")}`,"λ")}</div><small>${v("E")} = energi (J)<br>${v("h")} = tetapan Planck, 6,63 × 10<sup>−34</sup> J·s</small></div><div class="gl fx a"><em>KECEPATAN DI RUANG HAMPA</em><div style="font-size:38px">${v("c")} = ${fr("1",sq(`${v("μ","0")}${v("ε","0")}`))} ≈ 3 × 10<sup>8</sup> m/s</div><small>${v("μ","0")} = permeabilitas ruang hampa<br>${v("ε","0")} = permitivitas ruang hampa</small></div><div class="gl fx a"><em>HUBUNGAN MEDAN LISTRIK DAN MAGNET</em><div style="font-size:42px">${v("c")} = ${fr(v("E"),v("B"))}</div><small>${v("E")} = kuat medan listrik maksimum (V/m)<br>${v("B")} = induksi magnetik maksimum (T)</small></div></div>`,

konsep:`<h1 class="ti2 a">Apa Itu Gelombang Elektromagnetik?</h1><p class="a" style="font-size:21px;margin:-4px 0 16px 26px;line-height:1.55">Gelombang elektromagnetik adalah gelombang yang terdiri atas <b>medan listrik</b> dan <b>medan magnet</b> yang bergetar bersama-sama dan dapat merambat <b>tanpa memerlukan medium</b>.</p><div class="two2"><div class="gl cd a">${ic("mech","#64748b","#94a3b8")}<h3 style="color:var(--ink)">Gelombang Mekanik</h3><ul class="lst2"><li>Membutuhkan medium untuk merambat, misalnya udara, air, atau tali</li><li>Contoh: bunyi, gelombang laut, gelombang tali</li><li>Tidak dapat merambat di ruang hampa</li></ul></div><div class="gl cd a">${ic("bolt")}<h3>Gelombang Elektromagnetik</h3><ul class="lst2"><li>Tidak membutuhkan medium untuk merambat</li><li>Contoh: cahaya, sinyal radio dan Wi-Fi, sinar-X</li><li>Dapat merambat di ruang hampa</li></ul></div></div><div class="gl tip a">${ic("bulb","#f59e0b","#fbbf24")}<span><b>Analogi:</b> di luar angkasa tidak ada udara, sehingga bunyi tidak terdengar. Namun cahaya Matahari tetap sampai ke Bumi karena cahaya adalah gelombang elektromagnetik.</span></div>`,
bentuk:`<h1 class="ti2 a">Terbentuknya Gelombang Elektromagnetik</h1><div class="stp4">${[["Medan listrik berubah","Muatan listrik bergetar, misalnya arus bolak-balik pada antena, sehingga medan listrik berubah-ubah."],["Timbul medan magnet","Perubahan medan listrik menimbulkan medan magnet di sekitarnya."],["Timbul medan listrik baru","Perubahan medan magnet menimbulkan medan listrik yang baru."],["Merambat sebagai gelombang","Proses ini berulang terus-menerus dan merambat sebagai gelombang elektromagnetik."]].map((x,i)=>`<div class="gl stp a"><span class="n">${i+1}</span><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join("")}</div><div class="two2" style="margin-top:22px"><div class="gl tip a" style="margin:0">${ic("person","#0284c7","#38bdf8")}<span><b>James Clerk Maxwell</b> meramalkan bahwa perubahan medan listrik dan medan magnet dapat merambat sebagai gelombang.</span></div><div class="gl tip a" style="margin:0">${ic("person","#7c3aed","#a78bfa")}<span><b>Heinrich Hertz</b> membuktikan keberadaan gelombang elektromagnetik melalui percobaan.</span></div></div>`,
satuan:`<h1 class="ti2 a">Awalan Satuan dan Langkah Menghitung</h1><div class="two" style="align-items:stretch;gap:22px"><div class="gl cd a" style="padding:20px 24px"><h3>Awalan satuan yang sering dipakai</h3><div class="pf">${[["n","nano","10<sup>−9</sup>"],["µ","mikro","10<sup>−6</sup>"],["m","mili","10<sup>−3</sup>"],["c","senti","10<sup>−2</sup>"],["k","kilo","10<sup>3</sup>"],["M","mega","10<sup>6</sup>"],["G","giga","10<sup>9</sup>"]].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><i>${x[2]}</i></div>`).join("")}</div><p class="pt">Contoh: 1 nm = 10<sup>−9</sup> m, 1 MHz = 10<sup>6</sup> Hz, 1 GHz = 10<sup>9</sup> Hz.</p></div><div class="gl cd a" style="padding:20px 24px"><h3>Langkah mengerjakan soal</h3>${["Tulis yang diketahui dan yang ditanyakan.","Ubah semua satuan ke satuan SI (m, Hz, J).","Pilih rumus yang sesuai.","Masukkan angka, lalu hitung.","Tulis jawaban lengkap dengan satuannya."].map((x,i)=>`<div class="stl"><span class="n">${i+1}</span>${x}</div>`).join("")}<p class="pt">Ingat: ${v("c")} = ${c8} m/s, kecuali soal menyebut lain.</p></div></div>`,
sim:`<h1 class="ti2 a">Coba Sendiri: Geser Frekuensi</h1><div class="two" style="grid-template-columns:1.3fr 1fr;align-items:stretch;gap:22px"><div class="gl cd a" style="padding:18px 26px"><svg id="simWave" viewBox="0 0 520 90" class="wvs"><path d="M0 45H520" class="ax"/><path fill="none" stroke-width="4" stroke-linecap="round" d=""/></svg><input id="simSl" type="range" min="6" max="20.5" step="0.01" value="8" aria-label="Frekuensi gelombang"><div class="sct"><span>Frekuensi kecil</span><span>Frekuensi besar</span></div><div class="sbr">${BD.map(b=>`<span style="--a:${b[2]}">${b[1].replace("Gelombang ","")}</span>`).join("")}</div><div class="pre">${[["Radio FM",8],["Wi-Fi",9.38],["Cahaya hijau",14.74],["Sinar-X",18.48]].map(x=>`<button type="button" data-lf="${x[1]}">${x[0]}</button>`).join("")}</div></div><div class="col" style="gap:12px"><div class="gl fx a" style="align-items:flex-start"><em>JENIS GELOMBANG</em><div id="simB" class="sbadge">-</div></div><div class="gl fx a"><em>FREKUENSI</em><div style="font-size:30px">${v("f")} = <span id="simF"></span> Hz</div></div><div class="gl fx a"><em>PANJANG GELOMBANG</em><div style="font-size:30px">λ = <span id="simL"></span></div></div><div class="gl fx a"><em>ENERGI FOTON</em><div style="font-size:30px">${v("E")} = <span id="simE"></span> J</div></div></div></div>`,
ringkas:`<h1 class="ti2 a">Ringkasan Materi</h1><div class="g3">${[["bolt","Gelombang elektromagnetik terdiri atas medan listrik dan medan magnet, dan tidak membutuhkan medium."],["mech","Gelombang bersifat transversal: medan E, medan B, dan arah rambat saling tegak lurus."],["clock","Di ruang hampa, cepat rambat gelombang elektromagnetik adalah c = 3 × 10<sup>8</sup> m/s."],["tampak","Rumus c = λf: makin besar frekuensi, makin kecil panjang gelombangnya."],["uv","Rumus E = hf: makin besar frekuensi, makin besar energi fotonnya."],["list","Urutan spektrum dari frekuensi kecil: radio, mikro, inframerah, cahaya tampak, ultraviolet, sinar-X, gamma."]].map(x=>`<div class="gl bd a">${ic(x[0])}<p style="font-size:17.5px">${x[1]}</p></div>`).join("")}</div>`,
ex:[
ex(1,"Contoh Soal 1: Panjang Gelombang Radio FM",`Sebuah pemancar radio FM memancarkan gelombang berfrekuensi 100 MHz. Berapakah panjang gelombangnya?`,`${v("f")} = 100 MHz<br>${v("c")} = ${c8} m/s`,`λ = ... ?`,[[`Ubah satuan frekuensi ke hertz. Ingat 1 MHz = 10<sup>6</sup> Hz.`,`${v("f")} = 100 × 10<sup>6</sup> = 10<sup>8</sup> Hz`],[`Gunakan hubungan cepat rambat gelombang, lalu cari λ.`,`${v("c")} = λ${v("f")} → λ = ${fr(v("c"),v("f"))}`],[`Masukkan angkanya.`,`λ = ${fr(c8,"10<sup>8</sup>")} = 3 m`]],`panjang gelombang radio FM tersebut adalah <b>3 meter</b>.`,`<b>Tips:</b> frekuensi kecil, seperti radio, menghasilkan panjang gelombang yang besar.`),
ex(2,"Contoh Soal 2: Waktu Rambat Sinyal ke Bulan",`Jarak Bumi ke Bulan sekitar 3,84 × 10<sup>8</sup> m. Berapa lama sinyal radio dari Bumi sampai ke Bulan?`,`${v("s")} = 3,84 × 10<sup>8</sup> m<br>${v("c")} = ${c8} m/s`,`${v("t")} = ... ?`,[[`Sinyal radio adalah gelombang elektromagnetik, jadi kecepatannya sama dengan c.`,`${v("v")} = ${v("c")} = ${c8} m/s`],[`Jarak sama dengan kecepatan dikali waktu. Cari waktunya.`,`${v("s")} = ${v("c")}${v("t")} → ${v("t")} = ${fr(v("s"),v("c"))}`],[`Masukkan angkanya.`,`${v("t")} = ${fr("3,84 × 10<sup>8</sup>",c8)} = 1,28 s`]],`sinyal radio sampai ke Bulan dalam <b>1,28 sekon</b>.`,`<b>Tips:</b> cahaya dan sinyal radio sama-sama merambat dengan kecepatan c.`),
ex(3,"Contoh Soal 3: Frekuensi Cahaya Tampak",`Sebuah cahaya tampak memiliki panjang gelombang 500 nm. Tentukan frekuensi cahaya tersebut.`,`λ = 500 nm<br>${v("c")} = ${c8} m/s`,`${v("f")} = ... ?`,[[`Ubah nanometer ke meter. Ingat 1 nm = 10<sup>−9</sup> m.`,`λ = 500 × 10<sup>−9</sup> = 5 × 10<sup>−7</sup> m`],[`Dari ${v("c")} = λ${v("f")}, cari frekuensinya.`,`${v("f")} = ${fr(v("c"),"λ")}`],[`Masukkan angkanya.`,`${v("f")} = ${fr(c8,"5 × 10<sup>−7</sup>")} = 6 × 10<sup>14</sup> Hz`]],`frekuensi cahaya tersebut adalah <b>6 × 10<sup>14</sup> Hz</b>.`,`<b>Tips:</b> panjang gelombang kecil menghasilkan frekuensi yang besar.`),
ex(4,"Contoh Soal 4: Energi Foton Cahaya",`Sebuah cahaya tampak memiliki panjang gelombang 600 nm. Tentukan energi satu fotonnya.`,`λ = 600 nm<br>${v("h")} = 6,6 × 10<sup>−34</sup> J·s<br>${v("c")} = ${c8} m/s`,`${v("E")} = ... ?`,[[`Ubah nanometer ke meter.`,`λ = 600 × 10<sup>−9</sup> = 6 × 10<sup>−7</sup> m`],[`Energi foton ${v("E")} = ${v("h")}${v("f")}. Karena ${v("f")} = ${v("c")}/λ, maka:`,`${v("E")} = ${fr(`${v("h")}${v("c")}`,"λ")}`],[`Masukkan angkanya.`,`${v("E")} = ${fr(`(6,6 × 10<sup>−34</sup>)(${c8})`,"6 × 10<sup>−7</sup>")} = 3,3 × 10<sup>−19</sup> J`]],`energi satu foton cahaya tersebut adalah <b>3,3 × 10<sup>−19</sup> J</b>.`,`<b>Tips:</b> makin besar frekuensi atau makin kecil panjang gelombang, makin besar energi fotonnya.`)],
lat:`<h1 class="ti2 a">Latihan Soal</h1><p class="a" style="margin:-6px 0 14px 26px;font-size:18px;color:var(--mut);font-weight:600">Kerjakan dulu, lalu ketuk tombol untuk melihat jawabannya.</p><div class="three">${LT.map((x,i)=>`<div class="gl cd lt a"><h3><i>${i+1}</i>${x[0]}</h3><p style="text-align:left">${x[1]}</p><button class="rv" type="button">Lihat jawaban</button><div class="ans eq">${x[2]}</div></div>`).join("")}</div>`};
const S=[S0[0],S0[1],S0[2],NS.map,NS.konsep,NS.bentuk,S0[4],S0[5],NS.satuan,S0[6],S0[7],S0[8],NS.sim,NS.ringkas,...NS.ex,NS.lat];
const $=id=>document.getElementById(id),stage=$("stage"),deck=$("deck"),bg=$("bg");
deck.innerHTML=S.map(h=>`<section class="s"><div class="c"><div class="cc">${h}</div></div></section>`).join("");
const el=[...deck.children];
el.forEach(s=>s.querySelectorAll(".a").forEach((e,i)=>e.style.setProperty("--i",i)));
$("dots").innerHTML=T.map((t,i)=>`<b data-g="${i}" title="${t}"></b>`).join("");
const dots=[...$("dots").children];
let cur=-1;
function fitOne(s){const c=s.querySelector(".c"),cc=c.firstElementChild;
const ok=k=>{cc.style.setProperty("--k",k);const r=cc.getBoundingClientRect(),b=c.getBoundingClientRect();return r.height<=b.height+.5&&cc.scrollWidth*k<=b.width+1};
if(ok(1))return;let lo=.4,hi=1;for(let i=0;i<14;i++){const m=(lo+hi)/2;ok(m)?lo=m:hi=m}cc.style.setProperty("--k",lo)}
function fitAll(){document.body.classList.add("m");stage.style.transform="none";el.forEach(fitOne);document.body.classList.remove("m");scale()}

function go(n){n=Math.max(0,Math.min(N-1,n));if(n===cur)return;
stage.style.setProperty("--d",n>cur?1:-1);
if(cur>=0){const o=el[cur];o.classList.remove("on");o.classList.add("out");setTimeout(()=>o.classList.remove("out"),560)}
cur=n;el[n].classList.remove("out");el[n].classList.add("on");

dots.forEach((d,i)=>d.classList.toggle("on",i===n));

const menu=$("menu"),tm=o=>{if(o)$("mg").innerHTML=T.map((t,i)=>`<div class="gl mc ${i===cur?"cur":""}" data-g="${i}"><span class="rn">${String(i+1).padStart(2,"0")}</span><b>${t}</b><small>${i<3?"PENDAHULUAN":"MATERI"}</small></div>`).join("");menu.classList.toggle("open",o)};
$("pv").onclick=()=>go(cur-1);$("nx").onclick=()=>go(cur+1);$("mn").onclick=()=>tm(true);$("mx").onclick=()=>tm(false);

addEventListener("keydown",e=>{if(e.target&&e.target.tagName==="INPUT"&&e.key.indexOf("Arrow")===0)return;if(e.target&&e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;const o=menu.classList.contains("open");

if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
if(e.key==="Home")go(0);if(e.key==="End")go(N-1)});

addEventListener("touchstart",e=>{if(e.target.closest&&e.target.closest("input,button,a")){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{if(x0===null||menu.classList.contains("open"))return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1));x0=null});

const CC=3e8,HH=6.63e-34,SB=[[.3,1e9,0],[1e-3,.3,1],[7e-7,1e-3,2],[4e-7,7e-7,3],[1e-8,4e-7,4],[1e-11,1e-8,5],[0,1e-11,6]];
const sl=$("simSl"),sp=$("simWave").lastElementChild,UN=[[1e3,"km"],[1,"m"],[1e-2,"cm"],[1e-3,"mm"],[1e-6,"µm"],[1e-9,"nm"],[1e-12,"pm"]];
let sph=0,sc="#2563eb",sn=8;
const sci=x=>{const e=Math.floor(Math.log10(x));return (x/Math.pow(10,e)).toFixed(2).replace(".",",")+" × 10<sup>"+e+"</sup>"};
const fm=x=>(x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2)).replace(".",",");
function sim(){const lf=+sl.value,f=Math.pow(10,lf),l=CC/f,i=SB.find(b=>l>=b[0]&&l<b[1])[2];
const u=UN.find(a=>l>=a[0])||UN[6];
sc=i===3?`hsl(${Math.round(270*(1-(l-4e-7)/3e-7))} 85% 50%)`:BD[i][2];sn=2+(lf-6)/14.5*13;
